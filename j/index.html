<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>かざし 家族の在庫への招待 / NFC Stock invitation</title>
<meta property="og:title" content="かざし 家族の在庫への招待 / NFC Stock: Join my household">
<meta property="og:description" content="開いて「参加する」を押すと、家族と同じ在庫を使えます。 Open the link and tap Join to share the same stock.">
<style>
  :root { --bg:#2A5E4C; --card:#F6F3EE; --ink:#3E3328; --accent:#2E6B57; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); font-family:-apple-system, "Hiragino Sans", sans-serif; color:var(--ink); }
  main { background:var(--card); border-radius:24px; padding:28px 24px; margin:16px; max-width:420px; }
  h1 { font-size:20px; margin:0 0 12px; }
  p { font-size:15px; line-height:1.7; margin:0 0 14px; }
  ol { font-size:15px; line-height:1.7; margin:0 0 14px; padding-left:1.4em; }
  a.button { display:block; text-align:center; background:var(--accent); color:#fff; text-decoration:none;
             padding:16px; border-radius:14px; font-weight:600; font-size:17px; margin:18px 0 14px; }
  small { color:#7a6f63; font-size:13px; line-height:1.6; display:block; margin-top:10px; }
  small a { color:var(--accent); }
</style>
</head>
<body>
<main id="invite" hidden>
  <h1 data-t="title"></h1>
  <p data-t="lead"></p>
  <a class="button" id="open" href="#" data-t="open"></a>
  <ol>
    <li data-t="step1"></li>
    <li data-t="step2"></li>
  </ol>
  <small><span data-t="fallback"></span> <a id="icloud" href="#" data-t="fallbackLink"></a></small>
</main>
<main id="other" hidden>
  <h1 data-t="brokenTitle"></h1>
  <p data-t="brokenLead"></p>
</main>
<script>
  // 開いた人の言語で出す(日本語以外は英語)
  var ja = /^ja/i.test(navigator.language || '');
  var T = ja ? {
    title: '家族の在庫への招待です',
    lead: '下のボタンを押すと「かざし」が開きます。出てきた画面で「参加する」を押してください。',
    open: 'かざしで開く',
    step1: 'アプリがまだ無いときは、先に App Store で「かざし」を入れてください。',
    step2: '入れたら、もう一度このリンクを開いてください。',
    fallback: 'うまく開かないときは、',
    fallbackLink: 'こちらから iCloud の招待を開いてください。',
    brokenTitle: '招待のリンクが途中で切れています',
    brokenLead: '送られてきたリンクを、最後まで全部コピーして開いてください。'
  } : {
    title: 'You’re invited to a shared household',
    lead: 'Tap the button to open NFC Stock, then tap Join.',
    open: 'Open in NFC Stock',
    step1: 'Don’t have the app yet? Get “NFC Stock” on the App Store first.',
    step2: 'Then open this link again.',
    fallback: 'If it doesn’t open,',
    fallbackLink: 'open the iCloud invitation instead.',
    brokenTitle: 'This invitation link is incomplete',
    brokenLead: 'Copy the whole link you received and open it again.'
  };
  document.documentElement.lang = ja ? 'ja' : 'en';
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T[el.dataset.t]; });
  // 招待の印は # の後ろにある(# より後ろはサーバーに送られない)。英数字と - _ だけ受け付ける
  var t = location.hash.slice(1);
  if (/^[A-Za-z0-9_-]{8,128}$/.test(t)) {
    // 勝手にアプリを開くと、アプリが無いときに Safari がエラーを出すのでボタンにする
    document.getElementById('open').href = 'stockapp://join/' + t;
    document.getElementById('icloud').href = 'https://www.icloud.com/share/' + t;
    document.getElementById('invite').hidden = false;
  } else {
    document.getElementById('other').hidden = false;
  }
</script>
</body>
</html>
